name: Build WidgetForge IPA

# Builds WidgetForge.ipa (not signed for a phone; re-sign it with Sideloadly, AltStore, etc.).
# Every push builds. Pushing a tag that starts with "v" (for example v2.1) also publishes a GitHub Release
# with the IPA attached.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac type. If a run says the job was not acquired, try another one"
        type: choice
        options:
          - macos-latest
          - macos-15
          - macos-15-intel
        default: macos-latest
  push:
    branches:
      - "**"
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: build-widgetforge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Find the project
        run: |
          PROJECT=$(find . -maxdepth 4 -type d -name WidgetForge.xcodeproj | sort | sed -n 1p)
          if [ -z "$PROJECT" ]; then
            mkdir -p forge-src
            for Z in ./*.zip; do
              [ -f "$Z" ] || continue
              echo "Unzipping $Z"
              unzip -q -o "$Z" -d forge-src || true
            done
            PROJECT=$(find forge-src -maxdepth 5 -type d -name WidgetForge.xcodeproj | sort | sed -n 1p)
          fi
          if [ -z "$PROJECT" ]; then
            echo "forge: error: WidgetForge.xcodeproj was not found. Upload the project zip to the repository root without unzipping it." | tee build.log
            exit 1
          fi
          echo "Using $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Select newest stable Xcode
        run: |
          XCODE=$(python3 - <<'PY'
          import glob, re
          best = None
          for path in glob.glob("/Applications/Xcode_*.app"):
              m = re.fullmatch(r"/Applications/Xcode_(\d+(?:\.\d+)*)\.app", path)
              if m:
                  version = tuple(int(part) for part in m.group(1).split("."))
                  if best is None or version > best[0]:
                      best = (version, path)
          print(best[1] if best else "")
          PY
          )
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          set -o pipefail
          xcodebuild \
            -project "$PROJECT" \
            -scheme WidgetForge \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP=$(find build -type d -name 'WidgetForge.app' -path '*Release-iphoneos*' 2>/dev/null | sed -n 1p || true)
          if [ -z "$APP" ]; then
            echo "forge: error: The build finished but WidgetForge.app was not produced." | tee -a build.log
            exit 1
          fi
          APPEX="$APP/PlugIns/WidgetForgeExtension.appex"
          [ -d "$APPEX" ] || { echo "forge: error: The widget extension is missing from the app." | tee -a build.log; exit 1; }

          # Work out the App Group identifier the way Xcode does.
          SETTINGS="$(xcodebuild -project "$PROJECT" -target WidgetForge -configuration Release -sdk iphoneos -showBuildSettings 2>/dev/null || true)"
          GROUP="$(printf '%s\n' "$SETTINGS" | awk -F' = ' '/^[[:space:]]*APP_GROUP_IDENTIFIER = / && !found { print $2; found = 1 }')"
          if [ -z "$GROUP" ]; then
            BUNDLE_ID="$(awk -F'=' '/^[[:space:]]*APP_BUNDLE_ID[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' "$PROJECT_DIR/Config/WidgetForge.xcconfig")"
            GROUP="group.$BUNDLE_ID"
          fi
          echo "App Group: $GROUP"

          # An unsigned build has no entitlements, so ad-hoc sign with the expanded ones.
          mkdir -p ent
          for NAME in WidgetForge WidgetForgeExtension; do
            sed 's|[$](APP_GROUP_IDENTIFIER)|'"$GROUP"'|g' "$PROJECT_DIR/Resources/$NAME.entitlements" > "ent/$NAME.entitlements"
          done
          codesign --force --sign - --timestamp=none --entitlements ent/WidgetForgeExtension.entitlements "$APPEX"
          codesign --force --sign - --timestamp=none --entitlements ent/WidgetForge.entitlements "$APP"

          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist" 2>/dev/null || echo unknown)"
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "App version: $VERSION"

          rm -rf Payload WidgetForge.ipa
          mkdir Payload
          ditto "$APP" Payload/WidgetForge.app
          zip -q -r -y -X WidgetForge.ipa Payload
          cp WidgetForge.ipa "WidgetForge-$VERSION.ipa"
          ls -la WidgetForge*.ipa

      - name: Self-test (logic checks, never blocks the IPA)
        if: always() && hashFiles('Tests/SelfTest/main.swift') != ''
        continue-on-error: true
        run: |
          mkdir -p selftest/samples
          bash Tests/SelfTest/run.sh 2>&1 | tee selftest/driver.log

      - name: Summarize
        if: always()
        run: |
          touch build.log
          python3 tools/ci_report.py "${{ job.status }}" || true

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WidgetForge-ipa
          path: WidgetForge.ipa
          compression-level: 0
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            errors.txt
            build.log
            selftest/*.log

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          NOTES="RELEASE_NOTES.md"
          [ -f "$NOTES" ] || echo "WidgetForge $VERSION" > "$NOTES"
          gh release create "$TAG" "WidgetForge-$VERSION.ipa" --title "WidgetForge $VERSION" --notes-file "$NOTES" --latest \
            || gh release upload "$TAG" "WidgetForge-$VERSION.ipa" --clobber
