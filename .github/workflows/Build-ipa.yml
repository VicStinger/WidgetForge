name: Build WidgetForge IPA

# Builds WidgetForge.ipa (not signed for a phone; re-sign it with Sideloadly, AltStore, etc.).
# Put this file at .github/workflows/build-widgetforge-ipa.yml in your repository, and either upload
# the project zip (without unzipping it) to the repository root, or push the project folders themselves.
on:
  workflow_dispatch:
    inputs:
      runner:
        description: "Mac type. If a run says the job was not acquired, try another one"
        type: choice
        options:
          - macos-latest
          - macos-15
          - macos-15-intel
        default: macos-latest
  push:
    branches:
      - "**"

concurrency:
  group: build-widgetforge-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ${{ inputs.runner || 'macos-latest' }}
    timeout-minutes: 40
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Find the project
        run: |
          PROJECT=$(find . -maxdepth 4 -type d -name WidgetForge.xcodeproj | sort | sed -n 1p)
          if [ -z "$PROJECT" ]; then
            mkdir -p forge-src
            for Z in ./*.zip; do
              [ -f "$Z" ] || continue
              echo "Unzipping $Z"
              unzip -q -o "$Z" -d forge-src || true
            done
            PROJECT=$(find forge-src -maxdepth 5 -type d -name WidgetForge.xcodeproj | sort | sed -n 1p)
          fi
          if [ -z "$PROJECT" ]; then
            echo "forge: error: WidgetForge.xcodeproj was not found. Upload the project zip to the repository root without unzipping it." | tee build.log
            exit 1
          fi
          echo "Using $PROJECT"
          echo "PROJECT=$PROJECT" >> "$GITHUB_ENV"
          echo "PROJECT_DIR=$(dirname "$PROJECT")" >> "$GITHUB_ENV"

      - name: Select newest stable Xcode
        run: |
          XCODE=$(python3 - <<'PY'
          import glob, re
          best = None
          for path in glob.glob("/Applications/Xcode_*.app"):
              m = re.fullmatch(r"/Applications/Xcode_(\d+(?:\.\d+)*)\.app", path)
              if m:
                  version = tuple(int(part) for part in m.group(1).split("."))
                  if best is None or version > best[0]:
                      best = (version, path)
          print(best[1] if best else "")
          PY
          )
          if [ -n "$XCODE" ]; then
            sudo xcode-select -s "$XCODE"
          fi
          xcodebuild -version

      - name: Build (unsigned)
        run: |
          # First, ensure project structure allows clean building by generating or checking shared configs if needed
          xcodebuild \
            -project "$PROJECT" \
            -scheme WidgetForge \
            -configuration Release \
            -sdk iphoneos \
            -destination "generic/platform=iOS" \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build 2>&1 | tee build.log

      - name: Package IPA
        run: |
          APP=$(find build -type d -name 'WidgetForge.app' -path '*Release-iphoneos*' 2>/dev/null | sed -n 1p || true)
          if [ -z "$APP" ]; then
            echo "forge: error: The build finished but WidgetForge.app was not produced." | tee -a build.log
            exit 1
          fi
          
          # Check for appex plug-in if present, or handle gracefully if built without separate extension appex path
          APPEX="$APP/PlugIns/WidgetForgeExtension.appex"
          
          # Work out the App Group identifier the way Xcode does if entitlements exist
          SETTINGS="$(xcodebuild -project "$PROJECT" -target WidgetForge -configuration Release -sdk iphoneos -showBuildSettings 2>/dev/null || true)"
          GROUP="$(printf '%s\n' "$SETTINGS" | awk -F' = ' '/^[[:space:]]*APP_GROUP_IDENTIFIER = / && !found { print $2; found = 1 }')"
          if [ -z "$GROUP" ] && [ -f "$PROJECT_DIR/Config/WidgetForge.xcconfig" ]; then
            BUNDLE_ID="$(awk -F'=' '/^[[:space:]]*APP_BUNDLE_ID[[:space:]]*=/ { gsub(/[[:space:]]/, "", $2); print $2; exit }' "$PROJECT_DIR/Config/WidgetForge.xcconfig" || true)"
            if [ -n "$BUNDLE_ID" ]; then
              GROUP="group.$BUNDLE_ID"
            fi
          fi
          echo "App Group: $GROUP"

          # Sign app and extension with ad-hoc signing if entitlements exist
          mkdir -p ent
          if [ -d "$APPEX" ] && [ -f "$PROJECT_DIR/Resources/WidgetForgeExtension.entitlements" ]; then
            if [ -n "$GROUP" ]; then
              sed 's|[$](APP_GROUP_IDENTIFIER)|'"$GROUP"'|g' "$PROJECT_DIR/Resources/WidgetForgeExtension.entitlements" > "ent/WidgetForgeExtension.entitlements"
            else
              cp "$PROJECT_DIR/Resources/WidgetForgeExtension.entitlements" "ent/WidgetForgeExtension.entitlements"
            fi
            codesign --force --sign - --timestamp=none --entitlements ent/WidgetForgeExtension.entitlements "$APPEX"
          fi

          if [ -f "$PROJECT_DIR/Resources/WidgetForge.entitlements" ]; then
            if [ -n "$GROUP" ]; then
              sed 's|[$](APP_GROUP_IDENTIFIER)|'"$GROUP"'|g' "$PROJECT_DIR/Resources/WidgetForge.entitlements" > "ent/WidgetForge.entitlements"
            else
              cp "$PROJECT_DIR/Resources/WidgetForge.entitlements" "ent/WidgetForge.entitlements"
            fi
            codesign --force --sign - --timestamp=none --entitlements ent/WidgetForge.entitlements "$APP"
          else
            codesign --force --sign - --timestamp=none "$APP"
          fi

          rm -rf Payload WidgetForge.ipa
          mkdir Payload
          ditto "$APP" Payload/WidgetForge.app
          zip -q -r -y -X WidgetForge.ipa Payload

      - name: Summarize
        if: always()
        run: |
          touch build.log
          grep -E ": (error|warning): " build.log | sort -u > errors.txt || true
          {
            echo "## WidgetForge build: ${{ job.status }}"
            echo
            if grep -q ": error: " errors.txt; then
              echo "Copy these errors and send them back to get them fixed:"
              echo
              echo '```'
              grep ": error: " errors.txt | sed "s#/Users/runner/work/[^/]*/[^/]*/##" | sed -n '1,60p'
              echo '```'
            elif [ "${{ job.status }}" != "success" ]; then
              echo "The build stopped before producing an IPA. The end of the log:"
              echo
              echo '```'
              tail -n 40 build.log
              echo '```'
            else
              echo "Download **WidgetForge-ipa** from the Artifacts section at the bottom of this page."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: WidgetForge-ipa
          path: WidgetForge.ipa
          compression-level: 0
          if-no-files-found: error

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: |
            errors.txt
            build.log
